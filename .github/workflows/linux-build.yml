name: Linux packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload packages to the matching beta release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: AppImage, DEB, and RPM
    if: github.ref_name == 'beta-branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout beta branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            rpm \
            wget \
            xz-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch verified fonts
        run: pnpm run setup:fonts

      - name: Verify release configuration
        run: node scripts/verify-update-config.mjs

      - name: Verify bundled avatar catalog
        run: node scripts/verify-avatar-catalog.mjs

      - name: Build Linux packages
        run: pnpm run tauri:build:linux-system

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bear-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 14
          if-no-files-found: error

      - name: Upload packages to beta release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="beta-v${version}"
          gh release view "$tag" >/dev/null
          find src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec gh release upload "$tag" '{}' --clobber \;
