name: Bear Defaults Guard

on:
  push:
    branches:
      - beta-branch
  pull_request:
    branches:
      - beta-branch

permissions:
  contents: read

concurrency:
  group: bear-defaults-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  defaults:
    name: Product defaults
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Bear-owned defaults and services
        run: >-
          node --test
          tests/bear-product-defaults.test.ts
          tests/bear-api-worker.test.ts
          tests/together-relay-default.test.ts
