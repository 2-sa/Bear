name: Signed Tauri Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  HARBOR_BINARY_MIRROR_URL: https://harbor-binary-mirror.xyz7.workers.dev
  HARBOR_BINARY_MIRROR_REQUIRED: "1"

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform.name }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows-ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macOS-AppleSilicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS-Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Mac deps
        if: contains(matrix.platform.runner, 'macos')
        run: |
          brew install mpv pkg-config
          # Make pkg-config find libmpv from homebrew
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch verified fonts
        run: pnpm run setup:fonts

      - name: Fetch checksum-locked sidecars
        run: node scripts/fetch-binaries.mjs --target ${{ matrix.platform.target }}

      # ARM64 links against libmpv too, but there is no bare ARM64 libmpv-2.dll
      # hosted by Harbor and the committed src-tauri/libmpv/mpv.lib is x64-only.
      # Set up the ARM64 MSVC dev environment so lib.exe is available to rebuild
      # the import library for the ARM64 target from the committed libmpv.def.
      - name: Set up MSVC (Windows ARM64)
        if: matrix.platform.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Fetch libmpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        shell: pwsh
        run: |
          if ('${{ matrix.platform.target }}' -like '*aarch64*') {
            # Pinned upstream ARM64 libmpv dev bundle (shinchiro). Verify the
            # archive, extract libmpv-2.dll, and generate an ARM64 import lib
            # from the committed libmpv.def (same approach as setup-libmpv.ps1,
            # but /machine:arm64).
            $tag = '20260610'
            $asset = "mpv-dev-aarch64-$tag-git-304426c.7z"
            $sha = 'd9dd60db1c7b24db2e19d041f70abf0a4995f3e9eadf80a34e54f72300df6ed4'
            curl.exe --fail --location --retry 3 --retry-all-errors "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$asset" -o mpv-dev.7z
            $got = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash
            if ($got -ne $sha.ToUpper()) { throw "libmpv checksum mismatch: got $got" }
            7z x -y mpv-dev.7z -ompv-dev | Out-Null
            New-Item -ItemType Directory -Force src-tauri/libmpv | Out-Null
            $dll = (Get-ChildItem -Recurse mpv-dev -Filter libmpv-2.dll | Select-Object -First 1).FullName
            Copy-Item $dll src-tauri/libmpv/libmpv-2.dll -Force
            lib /def:src-tauri/libmpv/libmpv.def /machine:arm64 /out:src-tauri/libmpv/mpv.lib
            Remove-Item -Recurse -Force mpv-dev, mpv-dev.7z
          } else {
            pnpm run setup:libmpv
          }

      - name: Fetch verified mpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        run: pnpm run setup:mpv

      - name: harbor-core check
        working-directory: harbor-core
        run: |
          cargo check
          cargo test --all-targets

      - name: Verify signed updater configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/verify-update-config.mjs --require-signing-key

      - name: Build and upload signed release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.platform.target }}
          tagName: v__VERSION__
          releaseName: Harbor v__VERSION__
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
