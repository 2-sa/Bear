name: Signed Bear Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: windows-x64
        type: choice
        options:
          - windows-x64
          - windows-arm64
          - macos-arm64
          - macos-x64
          - desktop-all
      publish_update:
        description: Publish a signed update after all Windows and macOS builds pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  HARBOR_BINARY_MIRROR_URL: https://harbor-binary-mirror.xyz7.workers.dev
  HARBOR_BINARY_MIRROR_REQUIRED: "1"

concurrency:
  group: signed-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select beta build targets
    if: github.ref_name == 'beta-branch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        name: Validate request
        shell: bash
        run: |
          if [[ "${{ inputs.publish_update }}" == "true" && "${{ inputs.target }}" != "desktop-all" ]]; then
            echo "Publishing an update requires target=desktop-all." >&2
            exit 1
          fi
          case "${{ inputs.target }}" in
            windows-x64)
              matrix='[{"name":"Windows","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
              ;;
            windows-arm64)
              matrix='[{"name":"Windows-ARM64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]'
              ;;
            macos-arm64)
              matrix='[{"name":"macOS-AppleSilicon","runner":"macos-latest","target":"aarch64-apple-darwin"}]'
              ;;
            macos-x64)
              matrix='[{"name":"macOS-Intel","runner":"macos-15-intel","target":"x86_64-apple-darwin"}]'
              ;;
            desktop-all)
              matrix='[{"name":"Windows","runner":"windows-latest","target":"x86_64-pc-windows-msvc"},{"name":"Windows-ARM64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"},{"name":"macOS-AppleSilicon","runner":"macos-latest","target":"aarch64-apple-darwin"},{"name":"macOS-Intel","runner":"macos-15-intel","target":"x86_64-apple-darwin"}]'
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform.name }} (${{ matrix.platform.target }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    environment: release-signing
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout beta branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Mac deps
        if: contains(matrix.platform.runner, 'macos')
        run: |
          brew install mpv pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch verified fonts
        run: pnpm run setup:fonts

      - name: Fetch checksum-locked sidecars
        run: node scripts/fetch-binaries.mjs --target ${{ matrix.platform.target }}

      - name: Set up MSVC (Windows ARM64)
        if: matrix.platform.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Fetch libmpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        shell: pwsh
        run: |
          if ('${{ matrix.platform.target }}' -like '*aarch64*') {
            $tag = '20260610'
            $asset = "mpv-dev-aarch64-$tag-git-304426c.7z"
            $sha = 'd9dd60db1c7b24db2e19d041f70abf0a4995f3e9eadf80a34e54f72300df6ed4'
            curl.exe --fail --location --retry 3 --retry-all-errors "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$asset" -o mpv-dev.7z
            $got = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash
            if ($got -ne $sha.ToUpper()) { throw "libmpv checksum mismatch: got $got" }
            7z x -y mpv-dev.7z -ompv-dev | Out-Null
            New-Item -ItemType Directory -Force src-tauri/libmpv | Out-Null
            $dll = (Get-ChildItem -Recurse mpv-dev -Filter libmpv-2.dll | Select-Object -First 1).FullName
            Copy-Item $dll src-tauri/libmpv/libmpv-2.dll -Force
            lib /def:src-tauri/libmpv/libmpv.def /machine:arm64 /out:src-tauri/libmpv/mpv.lib
            Remove-Item -Recurse -Force mpv-dev, mpv-dev.7z
          } else {
            pnpm run setup:libmpv
          }

      - name: Fetch verified mpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        run: pnpm run setup:mpv

      - name: harbor-core check
        working-directory: harbor-core
        run: |
          cargo check
          cargo test --all-targets

      - name: Verify signed beta updater configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/verify-update-config.mjs --require-signing-key

      - name: Verify bundled avatar catalog
        run: node scripts/verify-avatar-catalog.mjs

      - name: Build and upload signed beta release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.platform.target }} --config src-tauri/tauri.release.conf.json
          tagName: beta-v__VERSION__
          releaseName: Bear v__VERSION__
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          includeUpdaterJson: ${{ inputs.publish_update != true }}
          updaterJsonPreferNsis: true
          retryAttempts: 2

      - name: Create isolated platform updater manifest
        if: inputs.publish_update == true
        run: node scripts/create-platform-update-manifest.mjs ${{ matrix.platform.target }}

      - name: Preserve platform updater manifest
        if: inputs.publish_update == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-manifest-${{ matrix.platform.target }}
          path: update-manifest-${{ matrix.platform.target }}.json
          if-no-files-found: error
          retention-days: 1

  publish-update:
    name: Publish complete beta update channel
    if: inputs.publish_update == true && inputs.target == 'desktop-all'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download isolated platform manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: updater-manifest-*
          path: updater-manifests
          merge-multiple: true

      - name: Merge and verify the complete signed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="beta-v${version}"
          node scripts/merge-update-manifests.mjs updater-manifests update-channel/latest.json "$tag" "$version"
          node scripts/verify-update-manifest.mjs update-channel/latest.json "$tag" "$version"
          echo "VERSION_TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish version release and advance beta channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$VERSION_TAG" update-channel/latest.json --clobber
          gh release edit "$VERSION_TAG" --draft=false --prerelease
          if gh release view beta-channel >/dev/null 2>&1; then
            gh release edit beta-channel --prerelease --title "Bear update channel"
          else
            gh release create beta-channel --target beta-branch --prerelease --title "Bear update channel" --notes "Signed updater manifest for Bear."
          fi
          gh release upload beta-channel update-channel/latest.json --clobber
