name: Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y appstream curl desktop-file-utils flatpak flatpak-builder git ostree python3-venv
      - name: Configure Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install pinned SDK
        run: >-
          flatpak install --user -y flathub
          org.gnome.Platform//49 org.gnome.Sdk//49
          org.freedesktop.Sdk.Extension.rust-stable//25.08
          org.freedesktop.Sdk.Extension.node22//25.08
      - name: Validate metadata
        run: |
          flatpak/update-flatpak.sh
          flatpak/update-flatpak.sh --check
          desktop-file-validate flatpak/dev.twosa.bear.beta.desktop
          appstreamcli validate --no-net flatpak/dev.twosa.bear.beta.metainfo.xml
          flatpak-builder --show-manifest flatpak/dev.twosa.bear.beta.yml >/dev/null
      - name: Build repository
        run: flatpak-builder --user --force-clean --state-dir=.flatpak-work/state --repo=.flatpak-work/repo .flatpak-work/build flatpak/dev.twosa.bear.beta.yml
      - name: Build single-file bundle
        run: flatpak build-bundle .flatpak-work/repo Bear.flatpak dev.twosa.bear.beta
      - name: Validate bundle
        run: |
          ostree init --repo=.flatpak-work/validation-repo --mode=archive-z2
          flatpak build-import-bundle --update-appstream --no-update-summary .flatpak-work/validation-repo Bear.flatpak
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bear-flatpak-x86_64
          path: Bear.flatpak
          retention-days: 14
          if-no-files-found: error
